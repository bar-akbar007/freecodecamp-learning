<!-- Gambar dianggap sebagai kekayaan intelektual. Ini berarti bahwa mereka dilindungi oleh peraturan hak cipta, paling sering milik pencipta. Secara default, gambar dirilis sebagai hak cipta dilindungi undang-undang. Pencipta, atau penerbit terkadang, memegang semua hak cipta atas gambar tersebut.

Ini berarti bahwa Anda tidak dapat menggunakannya di halaman web Anda kecuali Anda melakukan salah satu dari tiga hal: mendapatkan izin tertulis dari pemegang hak cipta, membeli lisensi dari pemegang hak cipta, atau menggabungkan gambar dengan cara yang termasuk dalam penggunaan wajar.

Poin ketiga itu agak rumit. Penggunaan wajar mengharuskan penggunaan gambar Anda terbatas dan transformatif. Beberapa contoh penggunaan wajar adalah mengomentari atau meninjau karya seni atau membuat parodi gambar.

Beberapa gambar mungkin dirilis di bawah lisensi permisif, seperti lisensi Creative Commons, atau lisensi BSD yang digunakan freeCodeCamp. Gambar-gambar ini tersedia untuk digunakan di situs web Anda, tetapi Anda harus membaca lisensi untuk memahami aturan yang perlu Anda ikuti saat menggunakan gambar-gambar ini. Misalnya, Anda mungkin diminta untuk membuat situs web Anda open source, atau Anda mungkin tidak diizinkan untuk memodifikasi gambar dengan cara apa pun.

Akhirnya, beberapa gambar mungkin akan dirilis ke domain publik. Sebuah gambar di bawah domain publik tidak memiliki hak cipta yang melekat padanya dan bebas untuk digunakan tanpa batasan apa pun. Gambar yang dilisensikan secara khusus di bawah lisensi Creative Commons 0 dianggap sebagai domain publik.

Sebagian besar mesin pencari akan memungkinkan Anda untuk memfilter hasil gambar dengan lisensi. Ada juga situs seperti Pixabay dan Unsplash, yang menawarkan gambar gratis untuk digunakan. Selalu waspada terhadap hak cipta dan lisensi saat Anda menggunakan gambar di situs web Anda. -->
