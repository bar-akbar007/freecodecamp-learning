<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Superscript dan Subscript</title>
  </head>

  <body>
    <main>
      <h1>HTML Superscript dan Subscript</h1>

      <section>
        <h2>Superscript</h2>

        <p>2<sup>2</sup> = 4</p>
        <p>5<sup>2</sup> = 25</p>
        <p>10<sup>3</sup> = 1000</p>

        <p>x<sup>2</sup> + y<sup>2</sup> = z<sup>2</sup></p>
      </section>

      <section>
        <h2>Subscript</h2>

        <p>H<sub>2</sub>O</p>
        <p>CO<sub>2</sub></p>
        <p>O<sub>2</sub></p>
        <p>C<sub>6</sub>H<sub>12</sub>O<sub>6</sub></p>
      </section>

      <section>
        <h2>Perbandingan</h2>

        <p>Superscript: 2<sup>3</sup> = 8</p>

        <p>Subscript: H<sub>2</sub>O</p>
      </section>
    </main>
  </body>
</html>
