<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Time Element</title>
  </head>

  <body>
    <main>
      <h1>HTML &lt;time&gt; Element</h1>

      <h2>Menampilkan Waktu</h2>

      <p>
        Acara dimulai pada
        <time datetime="20:00">20:00</time>.
      </p>

      <p>
        Waktu sore:
        <time datetime="15:00">15:00</time>.
      </p>

      <h2>Menampilkan Tanggal</h2>

      <p>
        Artikel diterbitkan pada
        <time datetime="2026-10-05">
          5 Oktober 2026
        </time>.
      </p>

      <h2>Menampilkan Tanggal dan Waktu</h2>

      <p>
        Acara dimulai pada
        <time datetime="2026-10-05T15:00:00">
          5 Oktober 2026 pukul 15:00
        </time>.
      </p>

      <p>
        Pertemuan berikutnya pada
        <time datetime="2026-10-10T20:00:00">
          10 Oktober 2026 pukul 20:00
        </time>.
      </p>
    </main>
  </body>
</html>
