<!DOCTYPE html> <!-- Menentukan bahwa dokumen ini menggunakan standar versi HTML5 -->
<html lang="en"> <!-- Tag utama pembungkus seluruh elemen HTML, menggunakan atribut bahasa Inggris ("en") -->

<head> <!-- Bagian head menyimpan informasi belakang layar (metadata) yang tidak tampil di area konten web -->
    <meta charset="UTF-8">
    <!-- Mengatur karakter encoding ke UTF-8 agar teks dan simbol dapat ditampilkan dengan benar -->
    <title> <!-- Judul halaman yang muncul pada tab peramban (browser) -->
        10 dosa besar soeharto
    </title>
</head>

<body> <!-- Bagian body berisi seluruh elemen visual yang dilihat oleh pengguna di layar -->

    <h1>10 desa besar soeharto</h1>
    <!-- Heading tingkat 1: Judul utama halaman (Catatan: kata "desa" mungkin maksudnya "dosa") -->

    <!-- Paragraf penjelas konten halaman -->
    <p>ini adalah sebuah artikel tentang mengena 10 dosa besar
        soeharto
    </p>

    <h2>Ingredients</h2> <!-- Heading tingkat 2: Subjudul untuk daftar bahan -->

    <!-- Unordered List (ul): Daftar tidak berurutan yang menampilkan poin bulat (bullet points) -->
    <ul>
        <li>bahan 1</li> <!-- List Item (li): Anggota/butir dalam daftar -->
        <li>bahan 2</li>
        <li>bahan 3</li>
        <li>bahan 4</li>
    </ul>

    <h2>Instructions</h2> <!-- Heading tingkat 2: Subjudul untuk langkah-langkah -->

    <!-- Ordered List (ol): Daftar berurutan yang otomatis menampilkan penomoran angka (1, 2, 3...) -->
    <ol>
        <li>Langkah 1</li> <!-- List Item (li): Anggota/butir langkah berurutan -->
        <li>Langkah 2</li>
        <li>Langkah 3</li>
        <li>Langkah 4</li>
    </ol>

    <!-- Tag img untuk menampilkan gambar dari tautan luar -->
    <!-- src = Alamat URL sumber gambar | alt = Teks alternatif jika gambar gagal dimuat -->
    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRYm0NFPevGJC1e-xPPQVGvizDbuia-hCy5sa3DldKq4g&s=10"
        alt="gambar 10 dosa besar soeharto">

</body>

</html>
