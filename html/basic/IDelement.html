<body>
    <!-- ========================================================================== -->
    <!-- CATATAN LENGKAP ATRIBUT 'ID' DALAM HTML                                     -->
    <!-- ========================================================================== -->

    <!-- [1] KONSEP DASAR (ANALOGI) -->
    <!-- ID (Identifier) dalam HTML ibarat NIK di KTP atau NISN siswa.              -->
    <!-- Satu halaman web tidak boleh memiliki dua elemen dengan nama ID yang sama. -->
    <!-- Jika butuh pengelompokan (seperti "kelas 10A"), gunakan atribut 'class'.   -->

    <!-- [2] ATURAN PENULISAN (SYNTAX & CONVENTION) -->
    <!-- Aturan Kunci:                                                              -->
    <!-- - Boleh menggunakan huruf, angka, tanda hubung (-), dan underscore (_)    -->
    <!-- - TIDAK BOLEH pakai spasi: id="header utama" (SALAH)                        -->
    <!-- - TIDAK BOLEH diawali angka: id="1header" (SALAH)                           -->
    <!-- - PEKA HURUF (Case-Sensitive): id="Utama" BERBEDA dengan id="utama"        -->

    <!-- [3] PERBANDINGAN: ID vs CLASS -->
    <!-- +----------------+-------------------------+-----------------------------+ -->
    <!-- | Fitur          | ID (#)                  | Class (.)                   | -->
    <!-- +----------------+-------------------------+-----------------------------+ -->
    <!-- | Jumlah/Halaman | Unik (1 per elemen)     | Jamak (Bisa berulang)       | -->
    <!-- | Analogi        | NIK / Nomor KTP         | Hobi / Jenis Kelamin        | -->
    <!-- | Hierarki CSS   | Sangat Tinggi           | Sedang                      | -->
    <!-- | Fokus utama    | Target JS & Anchor Link | Styling CSS Komponen        | -->
    <!-- +----------------+-------------------------+-----------------------------+ -->

    <!-- [4] TIGA FUNGSI UTAMA ID -->

    <!-- A. JavaScript DOM Manipulation (Paling Utama) -->
    <!--    Mengambil satu elemen spesifik secara presisi tanpa takut tertukar. -->
    <!--    Contoh di JS: -->
    <!--    const tombol = document.getElementById("btn-submit"); -->

    <!-- B. Navigasi Internal (Anchor Link) -->
    <!--    Membuat link yang melompat ke bagian halaman tertentu. -->
    <!--    Contoh Link  : <a href="#bagian-kontak">Ke Kontak</a> -->
    <!--    Contoh Target: <section id="bagian-kontak">...</section> -->

    <!-- C. Aksesibilitas Form (Label Matching) -->
    <!--    Menghubungkan <label> dengan elemen <input> agar bisa diklik. -->
    <!--    Contoh: -->
    <!--    <label for="input-email">Email:</label> -->
    <!--    <input type="email" id="input-email"> -->

    <!-- [5] BEST PRACTICES & KESALAHAN UMUM -->
    <!-- - Hindari memakai ID secara berlebihan hanya untuk CSS styling.             -->
    <!--   Prioritaskan Class untuk CSS agar kode lebih fleksibel dan mudah diubah.  -->
    <!-- - Gunakan ID untuk elemen krusial tunggal seperti: navbar utama, form       -->
    <!--   login, modal popup, atau elemen yang sering dimanipulasi JavaScript.     -->
