<!DOCTYPE html>
<!-- 
  DOKUMENTASI HALAMAN WIDGET VIDEO
  Fungsi: Menampilkan kompilasi video interaktif menggunakan tag iframe.
  Dibuat: September 2026
-->
<html lang="en">

<head>
    <!-- Menentukan pengodean karakter UTF-8 agar teks dan simbol universal terbaca dengan benar -->
    <meta charset="utf-8">
    
    <!-- Judul halaman yang akan muncul pada tab peramban (browser) -->
    <title>Video Compilation Page</title>
</head>

<body>
    <!-- <main>: Konten utama dari dokumen. Hanya boleh ada satu tag <main> dalam sebuah halaman -->
    <main> 
        <!-- <h1>: Judul utama halaman (Heading tingkat 1) -->
        <h1>Hello World</h1>
        
        <!-- <p>: Paragraf deskripsi singkat mengenai fungsi halaman -->
        <p>membuat halaman kompilasi video</p>

        <!-- ========================================== -->
        <!-- SECTION 1: Video Pertama                   -->
        <!-- ========================================== -->
        <section>
            <!-- <h2>: Sub-judul untuk mengelompokkan konten video pertama -->
            <h2>Section pertama</h2>
            <p>ini adalah section pertama</p>
            
            <!-- 
              <iframe>: Menyematkan (embed) halaman atau video eksternal (seperti YouTube/Vimeo).
              - src: Jalur atau URL sumber video (saat ini masih kosong).
              - title: Deskripsi aksesibilitas untuk pembaca layar (screen reader).
              - height & width: Menentukan ukuran dimensi pemutar video dalam satuan piksel.
            -->
            <iframe src="" title="section-pertama" height="100" width="200"></iframe>
        </section> <!-- Akhir dari Section 1 -->

        <!-- ========================================== -->
        <!-- SECTION 2: Video Kedua                     -->
        <!-- ========================================== -->
        <section>
            <h2>section kedua</h2>
            <p>ini adalah section kedua</p>
            <!-- Catatan: Nilai atribut 'title' sebaiknya disesuaikan dengan konten (misal: "section-kedua") -->
            <iframe src="" title="section-kedua" height="100" width="200"></iframe>
        </section> <!-- Akhir dari Section 2 -->

        <!-- ========================================== -->
        <!-- SECTION 3: Video Ketiga                    -->
        <!-- ========================================== -->
        <section>
            <h2>section ketiga</h2>
            <p>ini adalah section ketiga</p>
            <!-- Catatan: Nilai atribut 'title' sebaiknya disesuaikan dengan konten (misal: "section-ketiga") -->
            <iframe src="" title="section-ketiga" height="100" width="200"></iframe>
        </section> <!-- Akhir dari Section 3 -->

    </main> <!-- Akhir dari Konten Utama -->
</body>

</html>
