<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Heart Icon</title>
  </head>
  <body>
    <!-- 
      Fungsi Elemen <svg>:
      - Berfungsi sebagai wadah utama grafik vektor (Scalable Vector Graphics).
      - width & height : Mengunci ukuran tampilan elemen pada halaman sebesar 24x24 piksel.
      - viewBox        : Menentukan rasio dan sistem koordinat internal kanvas (X, Y, Lebar, Tinggi).
      - fill           : Mengatur fungsi pewarnaan global untuk mengisi bagian dalam objek (merah).
    -->
    <svg width="24" height="24" viewBox="0 0 24 24" fill="red">
      <!-- 
        Fungsi Elemen <path>:
        - Berfungsi untuk menggambar bentuk kustom yang kompleks (ikon hati) menggunakan baris kode instruksi.
        - Atribut 'd' (Data): Berisi kumpulan perintah matematika untuk mengarahkan pena virtual.
          * M (Move to)     : Menentukan titik koordinat awal mulainya gambar.
          * C & s (Curves)  : Fungsi kalkulasi bezier untuk menciptakan lengkungan halus daun hati.
          * z (Close Path)  : Fungsi menutup ujung garis kembali ke titik awal agar warna 'fill' bisa diterapkan sempurna.
      -->
      <path
        d="M12 21s-6-4.35-9.33-8.22C-.5 7.39 3.24 1 8.4 4.28 10.08 5.32 12 7.5 12 7.5s1.92-2.18 3.6-3.22C20.76 1 24.5 7.39 21.33 12.78 18 16.65 12 21 12 21z"
      ></path>
    </svg>
  </body>
</html>
