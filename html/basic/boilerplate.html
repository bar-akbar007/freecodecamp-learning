<!-- Ini memberi tahu browser versi HTML mana yang Anda gunakan. -->
<!doctype html>

<!-- Ini membungkus semua konten Anda dan dapat menentukan bahasa halaman Anda. Inside the html tag, Anda akan menemukan dua bagian utama -->
<html lang="en">

<!-- The head bagian berisi informasi penting di balik layar: -->
<!-- Metadata situs Anda, terkandung dalam meta elemen, memiliki rincian tentang hal-hal seperti pengkodean karakter, dan bagaimana situs web seperti Twitter harus melihat pratinjau tautan halaman Anda. Judul situs Anda, ditemukan di title elemen, menentukan teks yang muncul di tab atau jendela browser. Terakhir, Anda biasanya akan menautkan stylesheet eksternal halaman Anda di head bagian menggunakan link elements. -->

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
</head>

<body>
    <h1>I am a main title</h1>
    <p>Example paragraph text</p>
</body>

</html>
<!-- Sekarang, mengapa boilerplate penting? Ini memastikan halaman Anda terstruktur dengan benar dan bekerja dengan baik di berbagai browser. Menggunakan boilerplate membantu Anda menghindari kesalahan umum dan mengikuti praktik terbaik. Ini adalah titik awal yang bagus untuk proyek web apa pun. Ingat, Anda dapat menyesuaikan boilerplate Anda sendiri agar sesuai dengan kebutuhan Anda. Saat Anda mendapatkan pengalaman, Anda mungkin menambahkan elemen pilihan Anda sendiri atau meta tags. Ketika Anda terus meningkatkan boilerplate pribadi Anda, Anda akan menemukan bahwa itu menghemat waktu Anda ketika memulai proyek baru. -->
