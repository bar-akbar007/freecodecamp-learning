<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Working with the HTML Audio Element</title>
</head>

<body>
    <h1>freeCodeCamp Tunes</h1>

    <!-- DAFTAR LAGU 1: Can't Stay Down -->
    <h2>Can't Stay Down</h2>
    <p>Artist: Quincy Larson</p>
    <!-- 
    FUNGSI ATRIBUT AUDIO:
    - src: Alamat URL sumber file audio (mp3).
    - loop: Mengulang lagu secara otomatis dari awal setelah selesai diputar.
    - controls: Menampilkan tombol fisik pemutar audio bawaan browser (Play, Pause, Volume, Timeline).
  -->
    <audio src="https://freecodecamp.org" loop controls></audio>

    <!-- DAFTAR LAGU 2: Cruising for a Musing -->
    <h2>Cruising for a Musing</h2>
    <p>Artist: Quincy Larson</p>
    <!-- 
    FUNGSI ATRIBUT AUDIO:
    - src: Menghubungkan ke file audio 'cruising-for-a-musing.mp3'.
    - loop: Pemutaran berulang tanpa henti.
    - controls: Memberikan akses kontrol penuh bagi pengguna (bisa dikontrol juga lewat keyboard/mouse).
  -->
    <audio src="https://freecodecamp.org" loop controls></audio>

    <!-- DAFTAR LAGU 3: Scratching the Surface -->
    <h2>Scratching the Surface</h2>
    <p>Artist: Quincy Larson</p>
    <!-- 
    FUNGSI ATRIBUT AUDIO:
    - src: Menghubungkan ke file audio 'scratching-the-surface.mp3'.
    - loop: Mengaktifkan mode putar ulang otomatis.
    - controls: Menyediakan UI pemutar standar dari browser.
  -->
    <audio src="https://freecodecamp.org" loop controls></audio>
</body>

</html>
