<!-- Ada tiga hal yang perlu dipertimbangkan saat menggunakan media, seperti gambar, di halaman web Anda: ukuran, format, dan kompresi.

Mari kita bicara tentang ukuran gambar Anda terlebih dahulu. Saat Anda membuat situs web, Anda sering kali menata gambar untuk ditampilkan dalam ukuran tertentu. Misalnya, Anda mungkin memiliki tampilan gambar pada resolusi 640x480. 640 mewakili lebar sementara 480 mewakili tinggi dalam piksel. Saat mempersiapkan gambar Anda, Anda ingin menskalakannya ke ukuran 640x480 agar sesuai dengan gaya tersebut. Jika Anda menyajikan gambar berukuran 1920x1080 tetapi Anda menatanya menjadi jauh lebih kecil, Anda mengharuskan pengguna mengunduh data yang tidak perlu. Resolusi yang lebih kecil menghasilkan ukuran file yang lebih kecil.

Hal berikutnya yang perlu dipertimbangkan adalah format file Anda. Dua format file yang paling umum adalah PNG dan JPG, tetapi ini bukan lagi format yang paling ideal untuk menyajikan gambar. Kecuali Anda memerlukan dukungan untuk browser lama, Anda harus mempertimbangkan untuk menggunakan format yang lebih optimal, seperti WEBP atau AVIF.

Akhirnya, Anda dapat menjalankan algoritma kompresi pada gambar Anda untuk mengurangi ukuran file. Alat seperti pngcrush bekerja dengan baik untuk format lossless seperti PNG, yang dapat dikompresi tanpa kehilangan kualitas karena data asli dapat direkonstruksi dengan sempurna. Namun, tidak semua format lossless. JPG, misalnya, menggunakan kompresi lossy — setiap kali JPG disimpan ulang atau dikompresi ulang, beberapa data gambar dibuang secara permanen, sehingga kualitasnya menurun. Anda harus mengingat semua hal ini ketika memilih dan menyiapkan gambar untuk halaman web Anda. -->
