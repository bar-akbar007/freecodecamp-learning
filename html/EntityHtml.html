<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- Apa itu Entitas HTML?

Entitas HTML (HTML Entity) adalah kode khusus yang digunakan untuk menampilkan karakter tertentu di halaman HTML yang biasanya sulit ditulis langsung atau memiliki arti khusus dalam HTML.

Entitas HTML biasanya ditulis dengan format:

&nama;

atau:

&#kode;
Contoh sederhana

Misalnya kita ingin menampilkan tanda <.

Kalau ditulis langsung:

<p>5 < 10</p>

HTML bisa menganggap < sebagai awal tag.

Maka digunakan entitas:

<p>5 &lt; 10</p>

Hasilnya:

5 < 10

Fungsi Entitas HTML

Entitas HTML memiliki beberapa fungsi utama:

Fungsi	Contoh	Hasil
Menampilkan <	&lt;	<
Menampilkan >	&gt;	>
Menampilkan &	&amp;	&
Menampilkan spasi khusus	&nbsp;	spasi
Menampilkan copyright	&copy;	©
Menampilkan registered	&reg;	®
Menampilkan trademark	&trade;	™
Menampilkan tanda kutip	&quot;	"
Contoh dalam HTML
<h1>&copy; 2026 Website Saya</h1>

Hasil:

© 2026 Website Saya

Contoh lainnya:

<p>Gunakan &lt;div&gt; untuk membuat container.</p>

Hasil:

Gunakan <div> untuk membuat container.

Intinya

Entitas HTML = cara aman untuk menampilkan karakter khusus di HTML.

Yang paling sering kamu temui saat belajar web biasanya:

&lt;   → <
&gt;   → >
&amp;  → &
&nbsp; → spasi
&copy; → ©

Kalau kamu sedang belajar HTML untuk LKS, entitas seperti &lt;, &gt;, dan &amp; cukup penting karena berhubungan dengan cara HTML membaca karakter khusus. -->
</body>
</html>
